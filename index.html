<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>
    <!-- PyScript JavaScript -->
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
    <!-- PyScript CSS -->
    <link href="https://pyscript.net/releases/2026.7.2/core.css" rel="stylesheet" />
</head>
<body>
    <h1>Arithmetic Operations</h1>
    <form action="">
        <input type="number" id="num1" placeholder="Enter the first number"><br>
        <input type="number" id="num2" placeholder="Enter the second number"><br>
        <input type="button" py-click="adding_numbers" value="Add"><br>
        <input type="button" py-click="subtracting_numbers" value="Subtract"><br>
        <input type="button" py-click="multiplying_numbers" value="Multiply"><br>
        <input type="button" py-click="dividing_numbers" value="Divide"><br>
    </form>
    <div id="1"></div>
    <py-script src="main.py"></py-script>
</body>
</html>
